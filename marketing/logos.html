<!doctype html>
<!-- Square logo lockups, 1600×1600. Open with ?n=0..3 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>soltao logos</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1600px; background: #0b0b0c; }
  .logo {
    width: 1600px; height: 1600px;
    background: #0b0b0c;
    color: #f1efec;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .logo::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(640px 640px at 50% 42%, rgba(44, 202, 181, 0.16), transparent 70%),
      radial-gradient(520px 520px at 70% 80%, rgba(219, 134, 81, 0.10), transparent 72%);
    pointer-events: none;
  }
  .logo > * { position: relative; }
  .mark {
    display: block;
    filter: drop-shadow(0 0 28px rgba(44, 202, 181, 0.28));
  }
  .word {
    font-weight: 650;
    letter-spacing: -0.045em;
    line-height: 0.92;
  }
  .copper {
    font-style: normal;
    background: linear-gradient(100deg, #f0ae80, #db8651 46%, #c4683a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rule {
    width: 72px; height: 2px; border: 0; margin: 28px 0;
    background: #2ccab5;
  }
  .sub {
    color: #a8a6a3;
    font-size: 32px;
    letter-spacing: -0.02em;
  }
  .sub b { color: #db8651; font-weight: 650; }
  .url {
    margin-top: 28px;
    font: 550 26px/1 "Cascadia Mono", Consolas, ui-monospace, monospace;
    color: #62dfcc;
    letter-spacing: -0.02em;
  }
  .kicker {
    font: 600 18px/1 "Cascadia Mono", Consolas, ui-monospace, monospace;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #2ccab5;
  }

  .only .mark { width: 980px; height: 980px; filter: drop-shadow(0 0 42px rgba(44, 202, 181, 0.35)); }
  .only::before {
    background: radial-gradient(circle at 50% 50%, rgba(44, 202, 181, 0.14), transparent 58%);
  }

  .lock .mark { width: 460px; height: 460px; }
  .lock .word { margin-top: 36px; font-size: 132px; }
  .lock .sub { margin-top: 8px; }

  .stake .mark { width: 300px; height: 300px; }
  .stake .kicker { margin-top: 36px; }
  .stake .word { margin-top: 18px; font-size: 210px; font-weight: 700; letter-spacing: -0.055em; }

  .keys .mark { width: 420px; height: 420px; }
  .keys .word { margin-top: 48px; font-size: 108px; text-align: center; }
  .keys .brand {
    margin-top: 48px;
    font-weight: 650;
    font-size: 28px;
    letter-spacing: -0.03em;
    color: #85827e;
  }
</style>
</head>
<body>

<article class="logo only">
  <img class="mark" src="logo-cut.png" alt="">
</article>

<article class="logo lock">
  <img class="mark" src="logo-cut.png" alt="">
  <div class="word">soltao</div>
  <hr class="rule">
  <div class="sub">Solana <b>→</b> Bittensor</div>
</article>

<article class="logo stake">
  <img class="mark" src="logo-cut.png" alt="">
  <div class="kicker">soltao</div>
  <div class="word copper">stake</div>
  <div class="url">soltao.xyz/stake</div>
</article>

<article class="logo keys">
  <img class="mark" src="logo-cut.png" alt="">
  <div class="word">You keep<br><span class="copper">the keys.</span></div>
  <div class="brand">soltao</div>
</article>

<script>
const n = Number(new URLSearchParams(location.search).get("n") || "0");
document.querySelectorAll(".logo").forEach((el, i) => { if (i !== n) el.remove(); });
</script>
</body>
</html>
