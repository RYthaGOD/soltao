<!DOCTYPE html>
<html>
<head>
  <title>Minimal SIWS Test</title>
</head>
<body>
  <button id="btn">Sign In</button>
  <pre id="log"></pre>
  <script>
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";
    document.getElementById("btn").onclick = async () => {
      try {
        const provider = window.phantom?.solana;
        if (!provider) return log("No phantom provider");
        await provider.connect();
        log("Connected: " + provider.publicKey.toString());
        
        const input = {
          domain: window.location.host,
          address: provider.publicKey.toBase58(),
          statement: "Test statement",
          uri: window.location.href,
        };
        log("Calling signIn with: " + JSON.stringify(input));
        const res = await provider.signIn(input);
        log("Success! " + JSON.stringify(res));
      } catch (e) {
        log("Error: " + (e.message || e) + " (code " + e.code + ")");
      }
    };
  </script>
</body>
</html>
